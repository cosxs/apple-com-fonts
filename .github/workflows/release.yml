name: Release

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Discover, validate, package, and release
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          lfs: false
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project
        run: python -m pip install .

      - name: Define release paths
        id: release
        shell: bash
        run: |
          release_month="$(date -u +'%Y-%m')"
          package_name="apple-com-fonts-${release_month}"
          package_dir="${RUNNER_TEMP}/${package_name}"
          archive="${RUNNER_TEMP}/${package_name}.tar.gz"
          {
            echo "tag=fonts-${release_month}"
            echo "title=Apple.com fonts ${release_month}"
            echo "package_name=${package_name}"
            echo "package_dir=${package_dir}"
            echo "archive=${archive}"
            echo "checksum=${archive}.sha256"
          } >> "${GITHUB_OUTPUT}"

      - name: Download current Apple.com fonts
        env:
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
        run: |
          apple-com-fonts download \
            --fonts-dir "${PACKAGE_DIR}/fonts" \
            --output "${PACKAGE_DIR}/metadata" \
            --concurrency 16
          cp LICENSE NOTICE README.md README.zh-CN.md "${PACKAGE_DIR}/"

      - name: Verify download report
        env:
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
        shell: bash
        run: |
          report="${PACKAGE_DIR}/metadata/downloads.json"
          manifest="${PACKAGE_DIR}/metadata/manifest.json"
          jq --exit-status '
            .region_directory.status == 200 and
            .region_directory.error == null and
            .summary.homepages_requested > 0 and
            .summary.homepages_successful == .summary.homepages_requested and
            all(
              .stylesheets[];
              .status == 200 or
              ((.sources | all(startswith("version-probe:"))) and (.status == 400 or .status == 404))
            )
          ' "${manifest}"
          jq --exit-status '.summary.files_failed == 0' "${report}"
          requested="$(jq --raw-output '.summary.files_requested' "${report}")"
          discovered="$(jq --raw-output '.summary.unique_font_urls' "${manifest}")"
          stored="$(find "${PACKAGE_DIR}/fonts" -type f | wc -l)"
          test "${requested}" -gt 0
          test "${requested}" -eq "${discovered}"
          test "${requested}" -eq "${stored}"

      - name: Synchronize repository fonts
        id: sync
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PACKAGE_DIR: ${{ steps.release.outputs.package_dir }}
        shell: bash
        run: |
          git lfs install --local
          rsync --archive --delete "${PACKAGE_DIR}/fonts/" fonts/
          git add --all -- fonts

          requested="$(jq --raw-output '.summary.files_requested' "${PACKAGE_DIR}/metadata/downloads.json")"
          lfs_tracked="$(git lfs ls-files --name-only | wc -l)"
          test "${requested}" -eq "${lfs_tracked}"

          if git diff --cached --quiet -- fonts; then
            changed=false
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(fonts): sync Apple fonts $(date -u +'%Y-%m-%d')"
            git push origin "HEAD:${DEFAULT_BRANCH}"
            changed=true
          fi

          {
            echo "changed=${changed}"
            echo "commit_sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Build reproducible release archive
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
        shell: bash
        run: |
          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            --directory "${RUNNER_TEMP}" \
            --create \
            --file - \
            "${PACKAGE_NAME}" | gzip --best --no-name > "${ARCHIVE}"
          (
            cd "$(dirname "${ARCHIVE}")"
            sha256sum "$(basename "${ARCHIVE}")"
          ) > "${CHECKSUM}"

      - name: Create or update monthly release
        env:
          ARCHIVE: ${{ steps.release.outputs.archive }}
          CHECKSUM: ${{ steps.release.outputs.checksum }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          REPOSITORY_CHANGED: ${{ steps.sync.outputs.changed }}
          REPOSITORY_COMMIT: ${{ steps.sync.outputs.commit_sha }}
        shell: bash
        run: |
          release_notes="$(printf '%s\n' \
            'Monthly snapshot of font files publicly accessible from apple.com.' \
            '' \
            'The archive includes fonts, discovery metadata, source URLs, LICENSE, and NOTICE.' \
            "Repository fonts changed: ${REPOSITORY_CHANGED}. Commit: ${REPOSITORY_COMMIT}." \
            'Apple-provided font files are not covered by this project '\''s MIT License.' \
            'See NOTICE for source and third-party rights information.')"
          assets=(
            "${ARCHIVE}"
            "${CHECKSUM}"
          )
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --target "${REPOSITORY_COMMIT}" \
              --title "${RELEASE_TITLE}" \
              --notes "${release_notes}" \
              --latest
            for legacy_asset in manifest.json font-urls.txt downloads.json; do
              gh release delete-asset "${RELEASE_TAG}" "${legacy_asset}" --yes >/dev/null 2>&1 || true
            done
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --target "${REPOSITORY_COMMIT}" \
              --title "${RELEASE_TITLE}" \
              --notes "${release_notes}" \
              --latest
          fi
